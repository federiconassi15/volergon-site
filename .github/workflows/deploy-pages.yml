name: Publish Volergon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: volergon-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build with project-site base URL
        env:
          PUBLIC_SITE_URL: https://federiconassi15.github.io/volergon-site
        run: |
          npm run build
          npm run check
          grep -q 'href="/volergon-site/bureau/"' dist/index.html
          grep -q 'src="/volergon-site/assets/motion.js"' dist/index.html
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
